# Local development stack. Reads DATABASE_* and the other settings from .env
# (copy .env.example to .env first).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<version>
      - postgres-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./:/usr/src/app
    env_file:
      - .env
    environment:
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: 5432
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres-db:
